# Build a Linux amd64 Quarto tarball from this fork and publish it as a rolling release, so CI elsewhere can install the
# fork in seconds with `uses: sciris/quarto-cli/.github/actions/setup@main` instead of building it from source.
name: Sciris release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sciris-release
  cancel-in-progress: true

env:
  TAG: sciris-dev
  TARBALL: quarto-linux-amd64.tar.gz

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Patch version 99 marks the fork's builds (1.12.1 becomes 1.12.99). It has to stay a plain version: a suffix
      # like 1.12.1-sciris is a semver pre-release, which fails extensions' `quarto-required` checks.
      - name: Read the version
        id: version
        run: echo "version=$(cut -d. -f1,2 version.txt).99" >> "$GITHUB_OUTPUT"

      - name: Build the tarball
        uses: ./.github/actions/build-dist-tarball
        with:
          version: ${{ steps.version.outputs.version }}
          arch: amd64
          tarball-name: ${{ env.TARBALL }}
          artifact-name: quarto-linux-amd64
          retention-days: 7

      # Install the tarball the way the setup action does, and use it like the docs repos do, before replacing the release
      - name: Smoke-test the tarball
        run: |
          dir="$RUNNER_TEMP/quarto"
          mkdir -p "$dir" "$RUNNER_TEMP/smoke"
          tar -xzf "package/$TARBALL" -C "$dir" --strip-components=1
          export PATH="$dir/bin:$PATH"
          test "$(quarto --version)" = "${{ steps.version.outputs.version }}"
          cd "$RUNNER_TEMP/smoke"
          quarto add sciris/quartopydoc --no-prompt
          printf -- '---\ntitle: Smoke test\n---\n\nHello $x^2$\n' > smoke.qmd
          quarto render smoke.qmd
          test -s smoke.html

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Quarto ${{ steps.version.outputs.version }} built from sciris/quarto-cli@${GITHUB_SHA::9}. Replaced on every push to main."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --prerelease --title "Sciris Quarto (rolling)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "package/$TARBALL" --clobber
